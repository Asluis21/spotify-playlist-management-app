<div class="row">
    <div class="col-12">
        <h6>Results for "{{searchTrack}}"</h6>
    </div>
</div>

<ul class="list-group my-3">


    @for (t of tracks; track $index) {
        <li>
            <app-track-detail
                class="track-detail list-group-item d-flex gap-3 rounded-4" 
                [track]=t>            
            </app-track-detail>
        </li>
        
    }
